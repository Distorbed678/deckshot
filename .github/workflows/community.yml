# Checks community maps and cards in pull requests load in the game. It reads the submitted files
# as data only and needs no secrets.
name: Community check

on:
  pull_request:
    paths: ["community/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q love xvfb libgl1-mesa-dri
      - run: xvfb-run -a tests/run_community.sh
